plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.142'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    mavenCentral()
    // JEI (soft dep, wired in a later milestone)
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com"
        content { includeGroup("mezz.jei") }
    }
    flatDir {
        dir('libs')
    }
}

base {
    archivesName = "${mod_id}-${minecraft_version}-neoforge-${neo_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // astral_core (MIT, real dependency) — sibling SKD repo, not published to a Maven repo yet.
    // Consumed as a local jar built from its own repo (see docs/DESIGN_ALMANAC_CORE_1-21-1.md §6 M5).
    // Never jar-in-jar: this jar is NOT bundled into almanac_core's own jar (it's compileOnly +
    // localRuntime only, so it stays off the compile-time API surface exposed to consumers and
    // is only present for our own dev runs; end users install astral_core separately).
    compileOnly files("libs/astral_core-${minecraft_version}-neoforge-${neo_version}-${astral_core_version}.jar")
    localRuntime files("libs/astral_core-${minecraft_version}-neoforge-${neo_version}-${astral_core_version}.jar")

    // regalia_slots_api (LGPL-3.0) — NOT a direct dependency of almanac_core's own code, but
    // astral_core's neoforge.mods.toml declares it as required, so our own dev runs (runClient/
    // runServer/runGameTestServer) need it present transitively too, since `files(...)` deps
    // aren't real Gradle artifacts and don't resolve astral_core's own transitive requirements.
    // Real players never need this line — a modpack that installs astral_core already pulls in
    // regalia_slots_api on its own merit. localRuntime only, never compiled against directly here.
    localRuntime files("libs/regalia_slots_api-${minecraft_version}-neoforge-${neo_version}-1.0.0.jar")

    // vellumli (CC BY-NC-SA 3.0, soft, data-only) — compileOnly only, never localRuntime: our
    // default dev runs (runClient/runServer/runGameTestServer) exercise the "vellumli absent"
    // path, which is the one that matters most (majestic ships it as an optional dependency).
    // Only VellumliAPI (its public, stub-backed API class) is called — no vellumli code is ever
    // copied or derived, and it is never bundled.
    compileOnly files("libs/vellumli-${minecraft_version}-neoforge-${neo_version}-1.0.0.jar")

    // Wired in later milestones:
    //   - JEI (soft)                   : compileOnly "mezz.jei:jei-1.21.1-neoforge:${jei_version}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/resources/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
